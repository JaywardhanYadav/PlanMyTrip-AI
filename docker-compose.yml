version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: planmytrip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planmytrip
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planmytrip"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - planmytrip-network

  redis:
    image: redis:7-alpine
    container_name: planmytrip-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - planmytrip-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  planmytrip-network:
    driver: bridge