[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "planmytrip-backend"
version = "0.1.0"
description = "PlanMyTrip AI — Multi-Agent Travel Planning System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lead AI/ML Engineer & Systems Architect" }
]

dependencies = [
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "sse-starlette>=2.1.0,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "openai>=1.40.0,<2.0.0",
    "langgraph>=0.2.20,<0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0,<4.0.0",
    "langchain-core>=0.3.0,<0.4.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
    "asyncpg>=0.29.0,<0.30.0",
    "psycopg[binary,pool]>=3.2.0,<4.0.0",
    "redis>=5.0.0,<6.0.0",
    "alembic>=1.13.0,<2.0.0",
    "mcp>=1.0.0,<2.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "bcrypt>=4.1.0,<5.0.0",
    "httpx>=0.27.0,<0.28.0",
    "tenacity>=8.4.0,<9.0.0",
    "structlog>=24.2.0,<25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "ruff>=0.5.0,<0.6.0",
    "mypy>=1.10.0,<2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true