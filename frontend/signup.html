<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — PlanMyTrip AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>Create Account</h1>
      <p>Start planning enterprise multi-agent trips</p>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <form id="signup-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password (minimum 8 characters)</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" minlength="8" required>
      </div>

      <button type="submit" class="btn-primary" id="signup-btn">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in here</a>
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
